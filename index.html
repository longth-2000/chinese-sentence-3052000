<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học chữ qua câu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Câu Hán">
<meta name="theme-color" content="#0b6e66">
<style>
/* Layout: one study card per screen, thumb-reachable controls pinned at the bottom. */
:root{
  --bg:#eef2f4; --card:#ffffff; --card-2:#f5f8f9; --ink:#15212a; --mute:#5b6a75; --line:#d8e0e5;
  --acc:#0b6e66; --acc-ink:#ffffff; --acc-soft:#d9efec; --ok:#2b7a30; --ok-soft:#dff1e0;
  --font-zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181d; --card:#18232a; --card-2:#1f2d35; --ink:#e8eff2; --mute:#98a8b2; --line:#2b3a43;
    --acc:#4fc3b8; --acc-ink:#07201d; --acc-soft:#1b3a38; --ok:#7fd085; --ok-soft:#1e3a21; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10181d; --card:#18232a; --card-2:#1f2d35; --ink:#e8eff2; --mute:#98a8b2; --line:#2b3a43;
  --acc:#4fc3b8; --acc-ink:#07201d; --acc-soft:#1b3a38; --ok:#7fd085; --ok-soft:#1e3a21; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.4;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.prog{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.tabs{display:flex;gap:6px;background:var(--card-2);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:9px;font-weight:600;color:var(--mute);min-height:40px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:12px}
main[hidden]{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;min-height:36px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px 18px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.sent{font-family:var(--font-zh);font-size:clamp(34px,10.5vw,52px);line-height:1.35;letter-spacing:.04em;padding:18px 4px 12px;text-wrap:balance;word-break:keep-all}
.tok{display:flex;gap:2px;border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:8px 8px 6px}
.tok[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc)}
.c{display:flex;flex-direction:column;align-items:center;min-width:clamp(34px,11vw,50px)}
.z{font-family:var(--font-zh);font-size:clamp(34px,11vw,50px);line-height:1.1}
.h{font-size:11px;color:var(--mute);min-height:14px}
.hv-off .h{visibility:hidden}
.punc{font-family:var(--font-zh);font-size:clamp(30px,9vw,42px);align-self:flex-end;padding-bottom:20px;color:var(--mute)}
.gloss{min-height:44px;border-radius:12px;background:var(--card-2);padding:10px 12px;font-size:15px;color:var(--mute)}
.gloss b{font-family:var(--font-zh);font-size:20px;color:var(--ink);margin-right:6px}
.gloss .py{color:var(--acc);font-weight:600;margin-right:6px}
.trans{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:12px;min-height:64px}
.trans .py{font-size:18px;color:var(--acc);font-weight:600}
.trans .vi{font-size:18px}
.trans .hide{color:var(--mute);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{flex:1 1 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 10px;font-size:14px;min-height:42px}
.tool[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);font-weight:600}
nav.act{display:flex;gap:10px;padding:10px 16px 16px;border-top:1px solid var(--line);background:var(--bg)}
nav.act button{border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:54px;font-weight:600;font-size:16px}
#prev,#next{flex:1}
#know{flex:1.6;background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
#know[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.w{cursor:pointer;border-radius:10px;padding:2px 1px;margin:0 -1px;transition:background .15s}
.w[aria-pressed="true"]{background:var(--acc-soft);box-shadow:0 0 0 2px var(--acc-soft)}
.gloss{min-height:96px;border-radius:14px;background:var(--card-2);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:16px;color:var(--mute)}
.gloss .gz{font-family:var(--font-zh);font-size:30px;color:var(--ink);line-height:1.2}
.gloss .gp{font-size:20px;font-weight:700;color:var(--acc)}
.gloss .gv{font-size:18px;color:var(--ink)}
.gloss .gh{font-size:13px}
.gloss .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.speak{flex:none;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:12px;padding:8px 14px;font-weight:600;min-height:42px}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:0}
.cell .z{font-size:34px}
.cell .n{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.cell.none{opacity:.55}
.note{font-size:13px;color:var(--mute)}
.filterline{display:flex;align-items:center;gap:8px;font-size:14px}
.filterline button{border:1px solid var(--acc);background:var(--acc-soft);border-radius:999px;padding:5px 12px;min-height:34px}
.gloss .ge{font-size:15px;color:var(--ink)}
.gram{border-top:1px dashed var(--line);padding-top:12px;font-size:16px;line-height:1.5}
.gram[hidden]{display:none}
.tool.danger{color:#b3261e;border-color:#e3b5b1}
.trow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px}
.trow .tz{font-family:var(--font-zh);font-size:22px}
.trow .tv{font-size:13px;color:var(--mute)}
.trow .tx{flex:1;min-width:0}
.trow button{flex:none;border:1px solid var(--acc);background:var(--acc-soft);border-radius:10px;padding:6px 12px;min-height:38px}
.export{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:8px;font:13px/1.4 ui-monospace,Menlo,monospace}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top"><h1>Học chữ qua câu</h1><div class="prog" id="prog"></div></div>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-learn" aria-selected="true">Câu</button>
      <button role="tab" id="tab-chars" aria-selected="false">168 chữ</button>
      <button role="tab" id="tab-trash" aria-selected="false">Đã xoá</button>
    </div>
  </header>

  <main id="learn">
    <div class="filterline" id="filterline" hidden></div>
    <section class="card" id="card" aria-live="polite">
      <div class="meta"><span id="pos"></span></div>
      <div class="sent" id="sent"></div>
      <div class="gloss" id="gloss"></div>
      <div class="trans" id="trans"></div>
      <div class="gram" id="gram" hidden></div>
    </section>
    <div class="tools">
      <button class="tool" id="t-speak">Nghe cả câu</button>
      <button class="tool" id="t-rand" aria-pressed="false">Ngẫu nhiên</button>
      <button class="tool" id="t-todo" aria-pressed="false">Chưa thuộc</button>
      <button class="tool" id="t-gram" aria-pressed="false">Ngữ pháp</button>
      <button class="tool danger" id="t-del">Xoá câu</button>
    </div>
  </main>

  <main id="chars" hidden>
    <p class="note">Chạm vào một chữ để xem các câu có chứa chữ đó. Chữ mờ chưa có câu nào.</p>
    <div class="grid" id="grid"></div>
  </main>

  <main id="trash" hidden>
    <p class="note">Câu đã xoá chỉ bị ẩn trên máy này. Sao chép danh sách bên dưới gửi cho người sửa mã để xoá thật khỏi index.html (hoặc chạy <code>python3 tools/apply_deletes.py</code>).</p>
    <textarea class="export" id="export" readonly aria-label="Danh sách câu đã xoá"></textarea>
    <div class="tools">
      <button class="tool" id="t-copy">Sao chép danh sách</button>
      <button class="tool" id="t-restore-all">Khôi phục tất cả</button>
    </div>
    <div id="trashlist" style="display:flex;flex-direction:column;gap:8px"></div>
  </main>

  <nav class="act" id="actbar">
    <button id="prev" aria-label="Câu trước">Trước</button>
    <button id="know" aria-pressed="false">Đã thuộc</button>
    <button id="next" aria-label="Câu sau">Sau</button>
  </nav>
</div>

个 + danh từ: 十 + 个 + 瓜. 瓜 (dưa) là danh từ một âm tiết.", "六个杯子。": "Số từ + 个 + danh từ. 杯子 có hậu tố 子 (dấu hiệu của nhiều danh từ đồ vật); đếm đồ vật nhỏ thì 个 là lựa chọn mặc định an toàn.", "一，二，三，四，五。": "Đếm số: các số từ đứng riêng, cách nhau bằng dấu phẩy, không cần động từ hay lượng từ.", "六，七，八，九，十。": "Tiếp tục đếm số 6–10: chỉ liệt kê số từ, cách nhau bằng dấu phẩy.", "每人一个苹果。": "每 + danh từ = mỗi…: 每人 (mỗi người), sau đó là phần chia 一个苹果. Câu không có động từ vì ngữ cảnh chia phần đã rõ.", "几个人？": "Hỏi số lượng: 几 + lượng từ + danh từ = “mấy…?”. 几 thay chỗ số từ, trật tự giữ nguyên; dấu ？ đủ làm câu hỏi, không cần 吗.", "半个苹果。": "半 (nửa) đứng ở vị trí số từ: 半 + 个 + 苹果. Vẫn theo mẫu số từ + lượng từ + danh từ.", "一勺米。": "Lượng từ đo lường: 勺 (thìa) thay 个. Danh từ khối như 米 (gạo) cần lượng từ đo lường: 一 + 勺 + 米.", "半斤茶。": "半 + 斤 + 茶: 斤 là lượng từ cân (500g), 茶 (trà) là danh từ khối. Cùng mẫu với 一勺米.", "三朵花。": "Lượng từ riêng: 朵 dùng cho hoa (và mây). Mỗi nhóm danh từ có lượng từ thích hợp: 三 + 朵 + 花.", "三种茶。": "种 = loại, kiểu, dùng làm lượng từ: 三 + 种 + 茶 (ba loại trà).", "再加一个苹果。": "再 (lại, thêm) là phó từ đứng trước động từ 加 (thêm). Mẫu: 再 + động từ + số từ + 个 + danh từ; chủ ngữ lược bỏ như một lời đề nghị.", "第一个人，第二个人。": "第 + số = số thứ tự (第一, 第二). Sau số thứ tự vẫn cần lượng từ 个 + danh từ; hai cụm song song, cách nhau bằng dấu phẩy.", "周一，周二，周三，周四，周五。": "Thứ trong tuần = 周 + số (周一 … 周六), riêng Chủ nhật là 周日. Câu chỉ liệt kê.", "周六，周日同休。": "同 (cùng) là phó từ đứng trước động từ 休 (nghỉ). Chủ ngữ 周六，周日 gồm hai ngày.", "每周休一日。": "每周 (mỗi tuần) là trạng ngữ thời gian đứng trước động từ 休. 一日 đứng SAU động từ để chỉ khoảng thời gian (nghỉ một ngày).", "明日几号？": "Hỏi ngày tháng: 几号 = ngày mấy. Câu chỉ thời gian bỏ động từ 是, chỉ ghép 明日 + 几号.", "每月一号。": "Câu danh từ: 每月 (mỗi tháng) + 一号 (mùng 1), bỏ động từ 是.", "明日回国。": "Trạng ngữ thời gian 明日 đứng TRƯỚC động từ 回, rồi tân ngữ 国. Chủ ngữ được lược. Thứ tự: thời gian – động từ – tân ngữ.", "日历在左，灯在右。": "Mẫu “danh từ + 在 + phương vị”: 左/右 đứng một mình = bên trái/bên phải. Hai vế đối xứng cách nhau bằng dấu phẩy.", "每日用功。": "每日 (mỗi ngày) là trạng ngữ thời gian trước vị ngữ 用功 (chăm chỉ).", "半日用功，半日休。": "Hai vế song song: 半日 + động từ/tính từ, trạng ngữ thời gian lặp lại để tạo nhịp đối.", "月在山上。": "Mẫu “Chủ ngữ + 在 + danh từ + phương vị”: 在 là động từ “ở”, phương vị từ đứng SAU danh từ (山上 = trên núi), ngược với tiếng Việt “trên núi”.", "明月在山上。": "Mẫu “Chủ ngữ + 在 + danh từ + phương vị”: 在 là động từ “ở”, phương vị từ đứng SAU danh từ (山上 = trên núi), ngược với tiếng Việt “trên núi”. 明 (sáng) bổ nghĩa cho 月: 明月 = trăng sáng.", "日在山后。": "Cùng mẫu “在 + danh từ + phương vị”: 后 (sau) theo sau 山 → 山后 = phía sau núi.", "夕日在山后。": "Cùng mẫu 在 + 山 + 后. 夕日 = mặt trời chiều (夕 bổ nghĩa cho 日).", "人在山上。": "Mẫu “Chủ ngữ + 在 + danh từ + phương vị”: 在 là động từ “ở”, phương vị từ đứng SAU danh từ (山上 = trên núi), ngược với tiếng Việt “trên núi”.", "马在山下。": "Cùng mẫu 在 + 山 + phương vị; 下 = dưới: 山下 = dưới chân núi.", "鱼在水里。": "Cùng mẫu; 里 = trong: 水里 = trong nước.", "网在水里。": "Cùng mẫu “danh từ + 在 + danh từ + 里”.", "牛在田里。": "Cùng mẫu; 田里 = trong ruộng.", "母牛在田里。": "Cùng mẫu; 母 (cái) đứng trước 牛 để chỉ giống cái: 母牛 = bò cái.", "豕在田里。": "Cùng mẫu “danh từ + 在 + 田 + 里”. 豕 là chữ cổ nghĩa là heo.", "禾在田里。": "Cùng mẫu “danh từ + 在 + 田 + 里”.", "玉米在田里。": "Cùng mẫu; 玉米 là danh từ ghép hai âm tiết làm chủ ngữ.", "兔在花园里。": "Cùng mẫu; 花园 (vườn hoa) là danh từ ghép, đứng trước 里.", "羊在前，牛在后。": "前 / 后 đứng một mình sau 在 = phía trước / phía sau (tương đối). Hai vế đối nhau bằng dấu phẩy.", "象在水中。": "Cùng mẫu; 中 = trong, giữa: 水中 tương đương 水里 nhưng trang trọng hơn.", "竹林在山上。": "Mẫu “Chủ ngữ + 在 + danh từ + phương vị”: 在 là động từ “ở”, phương vị từ đứng SAU danh từ (山上 = trên núi), ngược với tiếng Việt “trên núi”.", "圣火在山上。": "Mẫu “Chủ ngữ + 在 + danh từ + phương vị”: 在 là động từ “ở”, phương vị từ đứng SAU danh từ (山上 = trên núi), ngược với tiếng Việt “trên núi”. 圣火 = 圣 (thiêng) + 火 (lửa).", "火在灯里。": "Cùng mẫu “danh từ + 在 + danh từ + 里”: 灯里 = trong đèn.", "杯子在盘子上。": "在 + 盘子 + 上: 上 chỉ vị trí trên bề mặt. 盘子 có hậu tố 子 giống 杯子.", "苹果在盘子里。": "Cùng mẫu; 里 chỉ bên trong đĩa.", "水果在盘子里。": "Cùng mẫu “danh từ + 在 + 盘子 + 里”.", "鱼在盘子里。": "Cùng mẫu “danh từ + 在 + 盘子 + 里”.", "茶在杯子里。": "Cùng mẫu; 茶 là danh từ khối làm chủ ngữ.", "勺子在杯子里。": "Cùng mẫu; 勺子 (cái thìa) là danh từ, khác 勺 là lượng từ.", "匕在盘子上。": "Cùng mẫu; 匕 là chữ cổ chỉ cái thìa/dao găm.", "伞在手里。": "在 + 手 + 里 = trong tay: cách nói chỉ vật đang cầm.", "弓在左，刀在右。": "Cùng mẫu với 左/右 đứng một mình; hai vế đối xứng.", "左手大，右手小。": "Tính từ làm vị ngữ trực tiếp (左手 + 大) và hai vế đối lập 大/小; không cần 是 hay 很.", "男性在左，女性在右。": "Mẫu “danh từ + 在 + 左/右”; hai vế đối xứng.", "老友在国外。": "在 + 国外: 外 đã nằm trong từ ghép 国外 nên không thêm 里. 老友 = bạn cũ.", "好友在国内。": "在 + 国内: 内 (bên trong) nằm trong từ ghép; đối nghĩa của 国外.", "它在水里。": "它 là đại từ “nó” chỉ vật/con vật; câu theo mẫu 在 + 水 + 里.", "李氏在花园里。": "氏 gắn sau họ để gọi phụ nữ theo kiểu cổ (李氏 = bà họ Lý). Câu theo mẫu 在 + 花园 + 里.", "园丁在花园里。": "Cùng mẫu; 园丁 (người làm vườn) cấu tạo: 园 (vườn) + 丁 (người làm việc).", "工人在工厂里。": "Cùng mẫu; 工厂里 = trong nhà máy.", "工厂在山下。": "Cùng mẫu “danh từ + 在 + 山 + 下”.", "化工厂在山下。": "化工厂 = 化工 (công nghiệp hóa chất) + 厂: định ngữ đứng trước danh từ chính.", "主人在园里。": "园 là dạng một âm tiết của 花园; theo mẫu 在 + 园 + 里.", "好人。": "Tính từ + danh từ: định ngữ luôn đứng TRƯỚC danh từ được bổ nghĩa (好茶 = trà ngon), ngược với tiếng Việt “trà ngon”. 好 + 人 = người tốt.", "好心人平安。": "好心人 (người tốt bụng) là chủ ngữ; 平安 là vị ngữ tính từ (bình an), không cần 是.", "坏人不可信。": "不 + 可 + động từ: 不可信 = không thể tin / không đáng tin. 不 phủ định đứng trước 可.", "好人，坏人。": "Hai cụm danh từ đối lập 好人 / 坏人, ngăn cách bằng dấu phẩy.", "美人如花。": "如 = như: A + 如 + B (A giống B). Cách nói văn chương.", "女人美如花。": "女人 + 美 (tính từ) + 如花: “đẹp như hoa”. 如 + danh từ là kết cấu so sánh.", "男士，女士。": "士 là hậu tố lịch sự: 男士 (quý ông), 女士 (quý bà), dùng khi xưng hô trang trọng.", "国王坐在前，女王坐在后。": "Mẫu “chủ ngữ + 坐 + 在 + phương vị”: 在 đứng SAU 坐, chỉ vị trí kết quả của hành động. Hai vế đối nhau.", "男人坐在前，女人坐在后。": "Cùng mẫu 坐 + 在 + 前/后; hai chủ ngữ đối lập 男人 / 女人.", "老人坐在右。": "Mẫu 坐 + 在 + 右: vị trí đi sau động từ 坐.", "儿子在山上，女儿在园里。": "Hai vế theo mẫu 在 + danh từ + phương vị; 儿子/女儿 là hai chủ ngữ đối nhau.", "老李在花园里。": "老 + họ (老李) là cách gọi thân mật người lớn tuổi. Câu theo mẫu 在 + 花园 + 里.", "小丁十分努力。": "小 + họ (小丁) gọi thân mật người trẻ. Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "人人努力。": "Lặp một danh từ một âm tiết (人人) = mọi người, ai cũng. 努力 là vị ngữ.", "努力用功。": "Hai từ gần nghĩa đứng cạnh nhau: 努力 (cố gắng) bổ nghĩa hoặc đi đôi với 用功 (chăm chỉ).", "工人十分累。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "老人不累。": "不 + tính từ: 不累 = không mệt. 不 phủ định đứng ngay trước tính từ.", "老人安心。": "Chủ ngữ + 安心 (yên tâm): vị ngữ là cụm động-tân cố định.", "儿子十分好奇。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "老友品茶。": "Câu cơ bản chủ – động – tân: 老友 + 品 + 茶 (nhấm nháp trà). Thứ tự giống tiếng Việt.", "主人品茶。": "Chủ – động – tân: 主人 + 品茶.", "人品好。": "人品 (nhân cách) là chủ ngữ, 好 là vị ngữ tính từ, không cần 是/很.", "生，老，病，死。": "Bốn từ liệt kê (sinh, lão, bệnh, tử): chỉ là liệt kê, không cần câu đầy đủ.", "人生十分美。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "好友生日。": "Cụm danh từ: 好友 bổ nghĩa cho 生日 (sinh nhật của bạn thân). Thông thường thêm 的 (好友的生日), ở đây lược bỏ theo kiểu tiêu đề.", "王理国。": "Câu chủ – động – tân văn viết: 王 (vua) + 理 (cai quản) + 国 (nước).", "王召人。": "Chủ – động – tân: 王 + 召 (triệu tập) + 人.", "局内人，局外人。": "内/外 đi sau 局 rồi thêm 人: “người trong/ngoài cuộc”; hai cụm đối lập.", "耳，目，口，手。": "Câu liệt kê: các danh từ đứng riêng, ngăn cách bằng dấu phẩy, không có động từ.", "心，手，口。": "Câu liệt kê: các danh từ đứng riêng, ngăn cách bằng dấu phẩy, không có động từ.", "手环十分美。": "手环 = 手 (tay) + 环 (vòng): danh từ ghép bộ phận + vật. Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "耳环十分美。": "耳环 = 耳 (tai) + 环 (vòng) = hoa tai. Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "病人在花园里休。": "Địa điểm 在花园里 đứng TRƯỚC động từ 休 (trạng ngữ nơi chốn), khác với 坐在… nơi 在 đứng sau động từ.", "象大，兔小。": "Tính từ làm vị ngữ trực tiếp, hai vế đối lập 大/小. Tiếng Trung không cần động từ “là”.", "象又大又胖。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "牛瘦，马胖。": "Hai vế đối nhau, mỗi vế: chủ ngữ + tính từ (瘦 gầy / 胖 béo).", "牛，羊不一样。": "Chủ ngữ ghép 牛，羊 + 不 + 一样 (giống nhau): “A và B không giống nhau”.", "牛，羊明显不同。": "明显 (rõ ràng) là phó từ đứng trước 不同 (khác nhau).", "山高，水长。": "Hai vế đối nhau, mỗi vế danh từ + tính từ (高 cao / 长 dài).", "山十分高。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "山川十分美。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是. 山川 = núi và sông.", "中国十分广大。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "中国水系十分广大。": "水系 (hệ thống sông) bổ nghĩa cho 中国 và đứng sau; không cần 的. Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "中国工业十分大。": "Chủ ngữ ghép 中国工业 (công nghiệp Trung Quốc). Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "美国十分大。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "中亚十分大。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "全国平安。": "全 + danh từ = cả…: 全国 (cả nước) làm chủ ngữ, 平安 làm vị ngữ.", "山上不安全。": "山上 (trên núi) làm chủ ngữ chỉ nơi chốn; vị ngữ 不安全 = không an toàn.", "用火不安全。": "Cụm động-tân 用火 (dùng lửa) làm chủ ngữ cả câu; vị ngữ 不安全.", "灯十分明亮。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "鲜花又香又美。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "奇花又香又美。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "花朵样子十分美。": "花朵 + 样子 = dáng vẻ của bông hoa (danh từ đứng trước bổ nghĩa). Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "五朵花十分美。": "Số từ + lượng từ + danh từ: tiếng Trung luôn cần lượng từ giữa số và danh từ, không nói thẳng “số + danh từ” như tiếng Việt. Cụm 五朵花 làm chủ ngữ. Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "花美不美？": "Câu hỏi chính–phản: tính từ + 不 + tính từ (美不美) = “có đẹp không?”, không cần 吗.", "苹果又大又香。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "水果又大又香。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "木瓜又大又香。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "玉米又大又香。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "米十分香。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "茶十分香。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "茶可口。": "可口 (ngon miệng) làm vị ngữ trực tiếp, không cần 是 hay 很.", "菜十分可口。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "鱼又大又鲜。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "鱼丸又大又鲜。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "竹子又高又长。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "牛角又大又长。": "Mẫu “又…又…” (vừa…vừa…): nối hai tính từ cùng nói về một chủ ngữ; tính từ làm vị ngữ trực tiếp, không cần 是.", "羊毛十分好。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "羊皮十分好。": "Mẫu “Chủ ngữ + 十分 + tính từ”: 十分 (rất) là phó từ đứng trước tính từ; tính từ làm vị ngữ trực tiếp, không cần động từ 是.", "不大不小。": "Mẫu “不A不B”: không A cũng không B, nghĩa là vừa phải.", "好不好？": "Câu hỏi chính–phản: tính từ + 不 + tính từ (好不好) = “tốt không?”.", "茶如何？": "如何 (thế nào) là từ nghi vấn hỏi tình trạng; câu: chủ ngữ + 如何?", "同一个人。": "同一 (cùng một) + 个 + 人. Vẫn theo mẫu số từ + lượng từ + danh từ.", "同国人。": "同 (cùng) + 国 + 人 = người cùng nước; định ngữ đứng trước danh từ.", "何人在山上？": "何 là từ nghi vấn cổ; 何人 (ai) thay đúng vị trí của câu trả lời: ____ + 在 + 山上.", "用刀切瓜。": "Mẫu “用 + công cụ + động từ + tân ngữ”: 用刀 (dùng dao) đứng trước động từ 切 (cắt), tân ngữ 瓜. Chủ ngữ được lược.", "用刀切菜。": "Cùng mẫu 用 + công cụ + 切 + tân ngữ.", "切土豆。": "Câu chỉ có động-tân (切 + 土豆), không chủ ngữ, giống lời mệnh lệnh/hướng dẫn.", "用刀分瓜。": "Cùng mẫu 用刀 + động từ + tân ngữ; 分 = chia.", "再切一个瓜。": "再 + động từ + số từ + 个 + danh từ: “lại cắt thêm một quả”.", "用手分豆。": "Mẫu 用 + công cụ + động từ + tân ngữ: dùng tay chia đậu.", "用手击水。": "Cùng m  gỗ.", "大豆，小豆。": "Hai cụm tính từ + danh từ đối nhau: 大豆 (đậu nành) / 小豆 (đậu đỏ).", "水气，火气，香气。": "气 làm thành tố sau: 水气, 火气, 香气 — danh từ ghép “thứ + khí/hơi”.", "男子，女子。": "Danh từ ghép với 子: 男子 / 女子 chỉ nam giới / nữ giới.", "平局。": "Danh từ ghép 平 (bằng nhau) + 局 (ván, trận) = hòa.", "反击。": "Động từ ghép 反 (ngược lại) + 击 (đánh) = phản công.", "反手。": "反 (ngược) bổ nghĩa cho 手 (tay) → thế trái tay.", "爪子。": "Danh từ có hậu tố 子: 爪 + 子 = móng vuốt.", "好言。": "Tính từ + danh từ: 好 + 言 (lời) = lời hay.", "林，木，山，川。": "Câu liệt kê: các danh từ đứng riêng, ngăn cách bằng dấu phẩy, không có động từ."}};
const DICT = DATA.dict;
const PUNC = {'，':',','。':'.','？':'?','：':':'};
const KEY = 'hanzi-sentences-v1';

/* ---- sentences ---- */
const ALL = [];
DATA.sections.forEach((s, si) => s.items.forEach(it => {
  const zh = it.t.map(t => t.zh || t.p).join('');
  let py = it.t.map(t => t.py || PUNC[t.p] || t.p).join(' ').replace(/ ([,.?:])/g, '$1');
  py = py.charAt(0).toUpperCase() + py.slice(1);
  ALL.push({ t: it.t, vi: it.vi, si, zh, py, id: ALL.length });
}));
const live = s => !S.deleted.has(s.zh);
let CHAR_COUNT = {};
function recount(){
  CHAR_COUNT = {};
  ALL.filter(live).forEach(s => { new Set(s.zh).forEach(ch => { CHAR_COUNT[ch] = (CHAR_COUNT[ch] || 0) + 1; }); });
}

/* ---- state ---- */
const S = { ch: '', todo: false, rand: false, gram: false, showMeaning: false, learned: new Set(), deleted: new Set(), list: [], pos: 0, order: null };
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (Array.isArray(o.learned)) S.learned = new Set(o.learned);
    if (Array.isArray(o.deleted)) S.deleted = new Set(o.deleted);
  } catch (e) {}
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({ learned: [...S.learned], deleted: [...S.deleted] })); } catch (e) {}
}

/* ---- helpers ---- */
const $ = id => document.getElementById(id);
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildList(keepId){
  let l = ALL.filter(s => live(s) &&
    (!S.ch || s.zh.includes(S.ch)) &&
    (!S.todo || !S.learned.has(s.zh)));
  if (S.rand) l = shuffle(l);
  S.list = l;
  const i = keepId == null ? -1 : l.findIndex(s => s.id === keepId);
  S.pos = i >= 0 ? i : 0;
}

/* ---- render ---- */
function renderProgress(){
  const L = ALL.filter(live), t = L.length, n = L.filter(s => S.learned.has(s.zh)).length;
  $('prog').textContent = n + ' / ' + t + ' câu đã thuộc';
  $('barfill').style.width = (t ? 100 * n / t : 0) + '%';
}
/* ---- word detail + pronunciation ---- */
let VOICE = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  VOICE = vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if (!('speechSynthesis' in window)) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.8; if (VOICE) u.voice = VOICE;
    speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}
function showGloss(tok, w){
  [...$('sent').querySelectorAll('.w')].forEach(x => x.setAttribute('aria-pressed', String(x === w)));
  const g = $('gloss'); g.textContent = '';
  const top = el('div', 'row');
  top.appendChild(el('div', 'gz', tok.zh));
  const sp = el('button', 'speak', 'Nghe'); sp.type = 'button'; sp.onclick = () => speak(tok.zh);
  top.appendChild(sp);
  g.appendChild(top);
  g.appendChild(el('div', 'gp', tok.py));
  g.appendChild(el('div', 'gv', tok.vi));
  const en = EXTRA.en[tok.zh];
  if (en) g.appendChild(el('div', 'ge', 'English: ' + en));
  const hv = [...tok.zh].map(c => DICT[c]).filter(Boolean).join(' · ');
  if (hv) g.appendChild(el('div', 'gh', 'Hán Việt: ' + hv));
  if (!VOICE) g.appendChild(el('div', 'gh', 'Không nghe tiếng? Bật giọng tiếng Trung: Cài đặt, Trợ năng, Nội dung đọc, Giọng nói.'));
  speak(tok.zh);
}

function render(){
  renderProgress();
  $('t-rand').setAttribute('aria-pressed', String(S.rand));
  $('t-todo').setAttribute('aria-pressed', String(S.todo));
  const fl = $('filterline');
  if (S.ch) {
    fl.hidden = false; fl.textContent = '';
    fl.appendChild(document.createTextNode('Đang lọc theo chữ '));
    const b = el('button', null, S.ch + '  ✕'); b.onclick = () => { S.ch = ''; buildList(); render(); };
    fl.appendChild(b);
  } else fl.hidden = true;

  const sent = $('sent'), tr = $('trans');
  sent.textContent = ''; tr.textContent = ''; $('gloss').textContent = '';
  const s = S.list[S.pos];
  if (!s) {
    $('pos').textContent = '';
    sent.style.fontSize = '18px';
    sent.appendChild(el('div', 'empty', S.todo ? 'Bạn đã thuộc hết các câu.' : 'Không có câu nào.'));
    $('know').disabled = true; $('prev').disabled = true; $('next').disabled = true;
    $('t-del').disabled = true; renderGram(null);
    return;
  }
  sent.style.fontSize = '';
  $('know').disabled = false; $('prev').disabled = false; $('next').disabled = false; $('t-del').disabled = false;
  $('pos').textContent = 'Câu ' + (S.pos + 1) + ' / ' + S.list.length;
  s.t.forEach(tok => {
    if (tok.p != null) { sent.appendChild(document.createTextNode(tok.p)); return; }
    const w = el('span', 'w', tok.zh); w.setAttribute('role', 'button'); w.tabIndex = 0; w.setAttribute('aria-pressed', 'false');
    w.setAttribute('aria-label', tok.zh + ', ' + tok.py + ', ' + tok.vi);
    const pick = () => showGloss(tok, w);
    w.onclick = pick; w.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    sent.appendChild(w);
  });
  $('gloss').textContent = 'Chạm vào một từ để xem pinyin, nghĩa và nghe phát âm.';
  const b = el('button', 'tool', 'Xem nghĩa');
  b.onclick = () => { tr.textContent = ''; tr.appendChild(el('div', 'py', s.py)); tr.appendChild(el('div', 'vi', s.vi)); };
  tr.appendChild(b);
  const k = S.learned.has(s.zh);
  $('know').setAttribute('aria-pressed', String(k));
  $('know').textContent = k ? 'Đã thuộc ✓' : 'Đã thuộc';
  renderGram(s);
}
function renderGram(s){
  $('t-gram').setAttribute('aria-pressed', String(S.gram));
  const g = $('gram'); g.hidden = !(S.gram && s); g.textContent = s && EXTRA.gram[s.zh] || '';
}

function go(d){
  if (!S.list.length) return;
  S.pos = (S.pos + d + S.list.length) % S.list.length;
  render();
  $('learn').scrollTo({ top: 0 });
}

/* ---- chars tab ---- */
function renderGrid(){
  const g = $('grid'); g.textContent = '';
  Object.keys(DICT).forEach(ch => {
    const n = CHAR_COUNT[ch] || 0;
    const b = el('button', 'cell' + (n ? '' : ' none')); b.type = 'button';
    b.appendChild(el('span', 'z', ch)); b.appendChild(el('span', 'n', DICT[ch] + (n ? ' · ' + n : '')));
    b.setAttribute('aria-label', ch + ', ' + DICT[ch] + ', ' + n + ' câu');
    if (n) b.onclick = () => { S.ch = ch; S.todo = false; buildList(); setTab('learn'); render(); };
    g.appendChild(b);
  });
}
function setTab(t){
  ['learn', 'chars', 'trash'].forEach(k => {
    $(k).hidden = k !== t;
    $('tab-' + k).setAttribute('aria-selected', String(k === t));
  });
  $('actbar').hidden = t !== 'learn';
  if (t === 'trash') renderTrash();
}

/* ---- events ---- */
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('know').onclick = () => {
  const s = S.list[S.pos]; if (!s) return;
  if (S.learned.has(s.zh)) { S.learned.delete(s.zh); save(); render(); }
  else { S.learned.add(s.zh); save(); go(1); }
};
$('t-speak').onclick = () => { const s = S.list[S.pos]; if (s) speak(s.zh); };
$('t-rand').onclick = () => {
  const cur = S.list[S.pos]; S.rand = !S.rand;
  if (S.rand) {
    // Turning on: reshuffle and jump straight to a different sentence.
    buildList();
    if (cur && S.list.length > 1 && S.list[0].id === cur.id) S.list.push(S.list.shift());
  } else buildList(cur && cur.id);
  render();
};
$('t-gram').onclick = () => { S.gram = !S.gram; renderGram(S.list[S.pos]); };
$('t-del').onclick = () => {
  const s = S.list[S.pos]; if (!s) return;
  if (!confirm('Xoá câu “' + s.zh + '”?\nCâu sẽ bị ẩn khỏi danh sách; vào tab “Đã xoá” để xuất danh sách hoặc khôi phục.')) return;
  S.deleted.add(s.zh); save();
  S.list.splice(S.pos, 1); if (S.pos >= S.list.length) S.pos = 0;
  recount(); renderGrid(); updateTrashTab(); render();
};
function updateTrashTab(){ $('tab-trash').textContent = 'Đã xoá' + (S.deleted.size ? ' (' + S.deleted.size + ')' : ''); }
function exportJSON(){ return JSON.stringify({ delete: ALL.filter(s => S.deleted.has(s.zh)).map(s => s.zh) }); }
function restore(zhs){
  const cur = S.list[S.pos];
  zhs.forEach(z => S.deleted.delete(z)); save();
  recount(); renderGrid(); updateTrashTab(); buildList(cur && cur.id); renderProgress(); renderTrash();
}
function renderTrash(){
  const items = ALL.filter(s => S.deleted.has(s.zh));
  $('export').value = items.length ? exportJSON() : '';
  $('t-copy').disabled = $('t-restore-all').disabled = !items.length;
  const box = $('trashlist'); box.textContent = '';
  if (!items.length) { box.appendChild(el('div', 'empty', 'Chưa xoá câu nào.')); return; }
  items.forEach(s => {
    const r = el('div', 'trow'), tx = el('div', 'tx');
    tx.appendChild(el('div', 'tz', s.zh)); tx.appendChild(el('div', 'tv', s.vi));
    const b = el('button', null, 'Khôi phục'); b.type = 'button'; b.onclick = () => restore([s.zh]);
    r.appendChild(tx); r.appendChild(b); box.appendChild(r);
  });
}
$('t-copy').onclick = async () => {
  const ta = $('export'), b = $('t-copy');
  try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); try { document.execCommand('copy'); } catch (e2) {} }
  b.textContent = 'Đã sao chép ✓'; setTimeout(() => { b.textContent = 'Sao chép danh sách'; }, 1500);
};
$('t-restore-all').onclick = () => { if (confirm('Khôi phục tất cả ' + S.deleted.size + ' câu đã xoá?')) restore([...S.deleted]); };
$('t-todo').onclick = () => { S.todo = !S.todo; buildList(); render(); };
$('tab-learn').onclick = () => setTab('learn');
$('tab-chars').onclick = () => setTab('chars');
$('tab-trash').onclick = () => setTab('trash');
let x0 = null, y0 = null;
$('card').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
$('card').addEventListener('touchend', e => {
  if (x0 == null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  x0 = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });

if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('./sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    reg.update().catch(() => {});
  }).catch(() => {});
}
/* ---- start ---- */
load();
recount(); updateTrashTab();
buildList(); renderGrid(); render();
</script>
</body>
</html>
