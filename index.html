<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học chữ qua câu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Câu Hán">
<meta name="theme-color" content="#0b6e66">
<style>
/* Layout: one study card per screen, thumb-reachable controls pinned at the bottom. */
:root{
  --bg:#eef2f4; --card:#ffffff; --card-2:#f5f8f9; --ink:#15212a; --mute:#5b6a75; --line:#d8e0e5;
  --acc:#0b6e66; --acc-ink:#ffffff; --acc-soft:#d9efec; --ok:#2b7a30; --ok-soft:#dff1e0;
  --font-zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181d; --card:#18232a; --card-2:#1f2d35; --ink:#e8eff2; --mute:#98a8b2; --line:#2b3a43;
    --acc:#4fc3b8; --acc-ink:#07201d; --acc-soft:#1b3a38; --ok:#7fd085; --ok-soft:#1e3a21; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10181d; --card:#18232a; --card-2:#1f2d35; --ink:#e8eff2; --mute:#98a8b2; --line:#2b3a43;
  --acc:#4fc3b8; --acc-ink:#07201d; --acc-soft:#1b3a38; --ok:#7fd085; --ok-soft:#1e3a21; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.4;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.prog{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.tabs{display:flex;gap:6px;background:var(--card-2);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:9px;font-weight:600;color:var(--mute);min-height:40px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 12px;display:flex;flex-direction:column;gap:12px}
main[hidden]{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;min-height:36px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px 18px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.sent{font-family:var(--font-zh);font-size:clamp(34px,10.5vw,52px);line-height:1.35;letter-spacing:.04em;padding:18px 4px 12px;text-wrap:balance;word-break:keep-all}
.tok{display:flex;gap:2px;border:1px solid var(--line);background:var(--card-2);border-radius:14px;padding:8px 8px 6px}
.tok[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc)}
.c{display:flex;flex-direction:column;align-items:center;min-width:clamp(34px,11vw,50px)}
.z{font-family:var(--font-zh);font-size:clamp(34px,11vw,50px);line-height:1.1}
.h{font-size:11px;color:var(--mute);min-height:14px}
.hv-off .h{visibility:hidden}
.punc{font-family:var(--font-zh);font-size:clamp(30px,9vw,42px);align-self:flex-end;padding-bottom:20px;color:var(--mute)}
.gloss{min-height:44px;border-radius:12px;background:var(--card-2);padding:10px 12px;font-size:15px;color:var(--mute)}
.gloss b{font-family:var(--font-zh);font-size:20px;color:var(--ink);margin-right:6px}
.gloss .py{color:var(--acc);font-weight:600;margin-right:6px}
.trans{display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line);padding-top:12px;min-height:64px}
.trans .py{font-size:18px;color:var(--acc);font-weight:600}
.trans .vi{font-size:18px}
.trans .hide{color:var(--mute);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{flex:1 1 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 10px;font-size:14px;min-height:42px}
.tool[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc);font-weight:600}
nav.act{display:flex;gap:10px;padding:10px 16px 16px;border-top:1px solid var(--line);background:var(--bg)}
nav.act button{border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:54px;font-weight:600;font-size:16px}
#prev,#next{flex:1}
#know{flex:1.6;background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
#know[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.w{cursor:pointer;border-radius:10px;padding:2px 1px;margin:0 -1px;transition:background .15s}
.w[aria-pressed="true"]{background:var(--acc-soft);box-shadow:0 0 0 2px var(--acc-soft)}
.gloss{min-height:96px;border-radius:14px;background:var(--card-2);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:16px;color:var(--mute)}
.gloss .gz{font-family:var(--font-zh);font-size:30px;color:var(--ink);line-height:1.2}
.gloss .gp{font-size:20px;font-weight:700;color:var(--acc)}
.gloss .gv{font-size:18px;color:var(--ink)}
.gloss .gh{font-size:13px}
.gloss .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.speak{flex:none;border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:12px;padding:8px 14px;font-weight:600;min-height:42px}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:0}
.cell .z{font-size:34px}
.cell .n{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.cell.none{opacity:.55}
.note{font-size:13px;color:var(--mute)}
.filterline{display:flex;align-items:center;gap:8px;font-size:14px}
.filterline button{border:1px solid var(--acc);background:var(--acc-soft);border-radius:999px;padding:5px 12px;min-height:34px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top"><h1>Học chữ qua câu</h1><div class="prog" id="prog"></div></div>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-learn" aria-selected="true">Câu</button>
      <button role="tab" id="tab-chars" aria-selected="false">168 chữ</button>
    </div>
  </header>

  <main id="learn">
    <div class="filterline" id="filterline" hidden></div>
    <section class="card" id="card" aria-live="polite">
      <div class="meta"><span id="pos"></span></div>
      <div class="sent" id="sent"></div>
      <div class="gloss" id="gloss"></div>
      <div class="trans" id="trans"></div>
    </section>
    <div class="tools">
      <button class="tool" id="t-speak">Nghe cả câu</button>
      <button class="tool" id="t-rand" aria-pressed="false">Ngẫu nhiên</button>
      <button class="tool" id="t-todo" aria-pressed="false">Chưa thuộc</button>
    </div>
  </main>

  <main id="chars" hidden>
    <p class="note">Chạm vào một chữ để xem các câu có chứa chữ đó. Chữ mờ chưa có câu nào.</p>
    <div class="grid" id="grid"></div>
  </main>

  <nav class="act" id="actbar">
    <button id="prev" aria-label="Câu trước">Trước</button>
    <button id="know" aria-pressed="false">Đã thuộc</button>
    <button id="next" aria-label="Câu sau">Sau</button>
  </nav>
</div>

, {"t": [{"zh": "老李", "py": "lǎo Lǐ", "vi": "ông Lý"}, {"zh": "种菜", "py": "zhòng cài", "vi": "trồng rau"}, {"p": "。"}], "vi": "Ông Lý trồng rau."}, {"t": [{"zh": "女儿", "py": "nǚ'ér", "vi": "con gái"}, {"zh": "种花", "py": "zhòng huā", "vi": "trồng hoa"}, {"p": "。"}], "vi": "Con gái trồng hoa."}, {"t": [{"zh": "小牛", "py": "xiǎo niú", "vi": "bê"}, {"zh": "长大", "py": "zhǎngdà", "vi": "lớn lên"}, {"p": "。"}], "vi": "Bê lớn lên."}, {"t": [{"zh": "生火", "py": "shēng huǒ", "vi": "nhóm lửa"}, {"p": "。"}], "vi": "Nhóm lửa."}, {"t": [{"zh": "小丁", "py": "xiǎo Dīng", "vi": "Tiểu Đinh"}, {"zh": "上网", "py": "shàngwǎng", "vi": "lên mạng"}, {"p": "。"}], "vi": "Tiểu Đinh lên mạng."}, {"t": [{"zh": "女人", "py": "nǚrén", "vi": "phụ nữ"}, {"zh": "认", "py": "rèn", "vi": "nhận ra"}, {"zh": "友", "py": "yǒu", "vi": "bạn"}, {"p": "。"}], "vi": "Người phụ nữ nhận ra bạn."}, {"t": [{"zh": "老人", "py": "lǎorén", "vi": "người già"}, {"zh": "认", "py": "rèn", "vi": "nhận ra"}, {"zh": "人", "py": "rén", "vi": "người"}, {"p": "。"}], "vi": "Ông già nhận ra người."}, {"t": [{"zh": "老人", "py": "lǎorén", "vi": "người già"}, {"zh": "信", "py": "xìn", "vi": "tin"}, {"zh": "好人", "py": "hǎorén", "vi": "người tốt"}, {"p": "。"}], "vi": "Ông già tin người tốt."}, {"t": [{"zh": "不", "py": "bù", "vi": "không"}, {"zh": "可", "py": "kě", "vi": "có thể"}, {"zh": "不", "py": "bù", "vi": "không"}, {"zh": "信", "py": "xìn", "vi": "tin"}, {"p": "。"}], "vi": "Không thể không tin."}, {"t": [{"zh": "好", "py": "hǎo", "vi": "tốt"}, {"zh": "言", "py": "yán", "vi": "lời"}, {"zh": "好", "py": "hǎo", "vi": "tốt"}, {"zh": "语", "py": "yǔ", "vi": "lời"}, {"p": "。"}], "vi": "Lời hay ý đẹp."}, {"t": [{"zh": "老友", "py": "lǎoyǒu", "vi": "bạn cũ"}, {"zh": "言", "py": "yán", "vi": "nói"}, {"p": "："}, {"zh": "茶", "py": "chá", "vi": "trà"}, {"zh": "好", "py": "hǎo", "vi": "ngon"}, {"p": "。"}], "vi": "Bạn cũ nói: Trà ngon."}]}, {"title": "Cụm từ ngắn", "items": [{"t": [{"zh": "好", "py": "hǎo", "vi": "tốt"}, {"zh": "茶", "py": "chá", "vi": "trà"}, {"p": "。"}], "vi": "Trà ngon."}, {"t": [{"zh": "好", "py": "hǎo", "vi": "tốt"}, {"zh": "友", "py": "yǒu", "vi": "bạn"}, {"p": "。"}], "vi": "Bạn tốt."}, {"t": [{"zh": "老", "py": "lǎo", "vi": "già"}, {"zh": "马", "py": "mǎ", "vi": "ngựa"}, {"p": "。"}], "vi": "Ngựa già."}, {"t": [{"zh": "小", "py": "xiǎo", "vi": "nhỏ"}, {"zh": "兔", "py": "tù", "vi": "thỏ"}, {"p": "。"}], "vi": "Thỏ nhỏ."}, {"t": [{"zh": "大象", "py": "dàxiàng", "vi": "voi"}, {"p": "。"}], "vi": "Con voi."}, {"t": [{"zh": "木马", "py": "mùmǎ", "vi": "ngựa gỗ"}, {"p": "。"}], "vi": "Ngựa gỗ."}, {"t": [{"zh": "大豆", "py": "dàdòu", "vi": "đậu nành"}, {"p": "，"}, {"zh": "小豆", "py": "xiǎodòu", "vi": "đậu đỏ"}, {"p": "。"}], "vi": "Đậu nành, đậu đỏ."}, {"t": [{"zh": "水气", "py": "shuǐqì", "vi": "hơi nước"}, {"p": "，"}, {"zh": "火气", "py": "huǒqì", "vi": "hỏa khí"}, {"p": "，"}, {"zh": "香气", "py": "xiāngqì", "vi": "hương thơm"}, {"p": "。"}], "vi": "Hơi nước, hỏa khí, hương thơm."}, {"t": [{"zh": "男子", "py": "nánzǐ", "vi": "nam giới"}, {"p": "，"}, {"zh": "女子", "py": "nǚzǐ", "vi": "nữ giới"}, {"p": "。"}], "vi": "Nam giới, nữ giới."}, {"t": [{"zh": "平局", "py": "píngjú", "vi": "hòa"}, {"p": "。"}], "vi": "Hòa (trong trận đấu)."}, {"t": [{"zh": "反击", "py": "fǎnjī", "vi": "phản công"}, {"p": "。"}], "vi": "Phản công."}, {"t": [{"zh": "反手", "py": "fǎnshǒu", "vi": "trái tay"}, {"p": "。"}], "vi": "Trái tay."}, {"t": [{"zh": "爪子", "py": "zhuǎzi", "vi": "móng vuốt"}, {"p": "。"}], "vi": "Móng vuốt."}, {"t": [{"zh": "好", "py": "hǎo", "vi": "tốt"}, {"zh": "言", "py": "yán", "vi": "lời"}, {"p": "。"}], "vi": "Lời hay."}, {"t": [{"zh": "林", "py": "lín", "vi": "rừng"}, {"p": "，"}, {"zh": "木", "py": "mù", "vi": "gỗ"}, {"p": "，"}, {"zh": "山", "py": "shān", "vi": "núi"}, {"p": "，"}, {"zh": "川", "py": "chuān", "vi": "sông"}, {"p": "。"}], "vi": "Rừng, gỗ, núi, sông."}]}]};
const DICT = DATA.dict;
const PUNC = {'，':',','。':'.','？':'?','：':':'};
const KEY = 'hanzi-sentences-v1';

/* ---- sentences ---- */
const ALL = [];
DATA.sections.forEach((s, si) => s.items.forEach(it => {
  const zh = it.t.map(t => t.zh || t.p).join('');
  let py = it.t.map(t => t.py || PUNC[t.p] || t.p).join(' ').replace(/ ([,.?:])/g, '$1');
  py = py.charAt(0).toUpperCase() + py.slice(1);
  ALL.push({ t: it.t, vi: it.vi, si, zh, py, id: ALL.length });
}));
const CHAR_COUNT = {};
ALL.forEach(s => { new Set(s.zh).forEach(ch => { CHAR_COUNT[ch] = (CHAR_COUNT[ch] || 0) + 1; }); });

/* ---- state ---- */
const S = { ch: '', todo: false, rand: false, showMeaning: false, learned: new Set(), list: [], pos: 0, order: null };
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (Array.isArray(o.learned)) S.learned = new Set(o.learned);
  } catch (e) {}
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({ learned: [...S.learned] })); } catch (e) {}
}

/* ---- helpers ---- */
const $ = id => document.getElementById(id);
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function buildList(keepId){
  let l = ALL.filter(s =>
    (!S.ch || s.zh.includes(S.ch)) &&
    (!S.todo || !S.learned.has(s.zh)));
  if (S.rand) l = shuffle(l);
  S.list = l;
  const i = keepId == null ? -1 : l.findIndex(s => s.id === keepId);
  S.pos = i >= 0 ? i : 0;
}

/* ---- render ---- */
function renderProgress(){
  const n = S.learned.size, t = ALL.length;
  $('prog').textContent = n + ' / ' + t + ' câu đã thuộc';
  $('barfill').style.width = (100 * n / t) + '%';
}
/* ---- word detail + pronunciation ---- */
let VOICE = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  VOICE = vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if (!('speechSynthesis' in window)) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.8; if (VOICE) u.voice = VOICE;
    speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}
function showGloss(tok, w){
  [...$('sent').querySelectorAll('.w')].forEach(x => x.setAttribute('aria-pressed', String(x === w)));
  const g = $('gloss'); g.textContent = '';
  const top = el('div', 'row');
  top.appendChild(el('div', 'gz', tok.zh));
  const sp = el('button', 'speak', 'Nghe'); sp.type = 'button'; sp.onclick = () => speak(tok.zh);
  top.appendChild(sp);
  g.appendChild(top);
  g.appendChild(el('div', 'gp', tok.py));
  g.appendChild(el('div', 'gv', tok.vi));
  const hv = [...tok.zh].map(c => DICT[c]).filter(Boolean).join(' · ');
  if (hv) g.appendChild(el('div', 'gh', 'Hán Việt: ' + hv));
  if (!VOICE) g.appendChild(el('div', 'gh', 'Không nghe tiếng? Bật giọng tiếng Trung: Cài đặt, Trợ năng, Nội dung đọc, Giọng nói.'));
  speak(tok.zh);
}

function render(){
  renderProgress();
  $('t-rand').setAttribute('aria-pressed', String(S.rand));
  $('t-todo').setAttribute('aria-pressed', String(S.todo));
  const fl = $('filterline');
  if (S.ch) {
    fl.hidden = false; fl.textContent = '';
    fl.appendChild(document.createTextNode('Đang lọc theo chữ '));
    const b = el('button', null, S.ch + '  ✕'); b.onclick = () => { S.ch = ''; buildList(); render(); };
    fl.appendChild(b);
  } else fl.hidden = true;

  const sent = $('sent'), tr = $('trans');
  sent.textContent = ''; tr.textContent = ''; $('gloss').textContent = '';
  const s = S.list[S.pos];
  if (!s) {
    $('pos').textContent = '';
    sent.style.fontSize = '18px';
    sent.appendChild(el('div', 'empty', S.todo ? 'Bạn đã thuộc hết các câu.' : 'Không có câu nào.'));
    $('know').disabled = true; $('prev').disabled = true; $('next').disabled = true;
    return;
  }
  sent.style.fontSize = '';
  $('know').disabled = false; $('prev').disabled = false; $('next').disabled = false;
  $('pos').textContent = 'Câu ' + (S.pos + 1) + ' / ' + S.list.length;
  s.t.forEach(tok => {
    if (tok.p != null) { sent.appendChild(document.createTextNode(tok.p)); return; }
    const w = el('span', 'w', tok.zh); w.setAttribute('role', 'button'); w.tabIndex = 0; w.setAttribute('aria-pressed', 'false');
    w.setAttribute('aria-label', tok.zh + ', ' + tok.py + ', ' + tok.vi);
    const pick = () => showGloss(tok, w);
    w.onclick = pick; w.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    sent.appendChild(w);
  });
  $('gloss').textContent = 'Chạm vào một từ để xem pinyin, nghĩa và nghe phát âm.';
  const b = el('button', 'tool', 'Xem nghĩa');
  b.onclick = () => { tr.textContent = ''; tr.appendChild(el('div', 'py', s.py)); tr.appendChild(el('div', 'vi', s.vi)); };
  tr.appendChild(b);
  const k = S.learned.has(s.zh);
  $('know').setAttribute('aria-pressed', String(k));
  $('know').textContent = k ? 'Đã thuộc ✓' : 'Đã thuộc';
}

function go(d){
  if (!S.list.length) return;
  S.pos = (S.pos + d + S.list.length) % S.list.length;
  render();
  $('learn').scrollTo({ top: 0 });
}

/* ---- chars tab ---- */
function renderGrid(){
  const g = $('grid'); g.textContent = '';
  Object.keys(DICT).forEach(ch => {
    const n = CHAR_COUNT[ch] || 0;
    const b = el('button', 'cell' + (n ? '' : ' none')); b.type = 'button';
    b.appendChild(el('span', 'z', ch)); b.appendChild(el('span', 'n', DICT[ch] + (n ? ' · ' + n : '')));
    b.setAttribute('aria-label', ch + ', ' + DICT[ch] + ', ' + n + ' câu');
    if (n) b.onclick = () => { S.ch = ch; S.todo = false; buildList(); setTab('learn'); render(); };
    g.appendChild(b);
  });
}
function setTab(t){
  const learn = t === 'learn';
  $('learn').hidden = !learn; $('chars').hidden = learn; $('actbar').hidden = !learn;
  $('tab-learn').setAttribute('aria-selected', String(learn));
  $('tab-chars').setAttribute('aria-selected', String(!learn));
}

/* ---- events ---- */
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('know').onclick = () => {
  const s = S.list[S.pos]; if (!s) return;
  if (S.learned.has(s.zh)) { S.learned.delete(s.zh); save(); render(); }
  else { S.learned.add(s.zh); save(); go(1); }
};
$('t-speak').onclick = () => { const s = S.list[S.pos]; if (s) speak(s.zh); };
$('t-rand').onclick = () => { S.rand = !S.rand; const cur = S.list[S.pos]; buildList(cur && cur.id); render(); };
$('t-todo').onclick = () => { S.todo = !S.todo; buildList(); render(); };
$('tab-learn').onclick = () => setTab('learn');
$('tab-chars').onclick = () => setTab('chars');
let x0 = null, y0 = null;
$('card').addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
$('card').addEventListener('touchend', e => {
  if (x0 == null) return;
  const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
  x0 = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
/* ---- start ---- */
load();
buildList(); renderGrid(); render();
</script>
